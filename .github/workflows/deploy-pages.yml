name: Deploy to GitHub Pages
# Keep the deployment pipeline deterministic for the latest main commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://aohdvlibkksdboohbhgb.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wJEYD2GMz8dEey-WJQ3LfA_LOK5tzKt
      - name: Include public assets excluded by the custom Vite publicDir
        run: |
          mkdir -p dist/cv
          cp -f public/cv/* dist/cv/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
