services:
  - type: web
    name: karima-moni
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: STORAGE_PATH
        value: /var/data
    disk:
      name: karima-moni-data
      mountPath: /var/data
      sizeGB: 1
